<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MindSpur - Spaced Reviews</title>
  
  <!-- iOS PWA Optimizations -->
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MindSpur">
  <meta name="theme-color" content="#1e1b4b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236366f1'/><text x='50' y='66' font-size='52' text-anchor='middle'>🧠</text></svg>">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Native Pull-to-Refresh Indicator */
    .pull-refresh-indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 0;
      overflow: hidden;
      font-size: 13px;
      font-weight: 600;
      color: #818cf8;
      background: rgba(99, 102, 241, 0.08);
      border-radius: var(--radius-sm);
      transition: height 0.2s ease, opacity 0.2s ease, margin-bottom 0.2s ease;
      opacity: 0;
      margin-bottom: 0;
      user-select: none;
    }
    .pull-refresh-indicator.visible {
      height: 40px;
      opacity: 1;
      margin-bottom: 4px;
    }
    .pull-refresh-indicator.refreshing .pull-icon {
      animation: spin 0.8s linear infinite;
    }
    :root {
      --bg-base: #0b0f17;
      --bg-card: #151c2c;
      --bg-card-hover: #1c263c;
      --bg-subtle: #1e293b;
      --border-subtle: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-indigo: #6366f1;
      --accent-purple: #a855f7;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #ef4444;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding-top: max(16px, env(safe-area-inset-top));
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      padding-left: max(16px, env(safe-area-inset-left));
      padding-right: max(16px, env(safe-area-inset-right));
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .app-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .brand-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      font-size: 28px;
      line-height: 1;
      filter: drop-shadow(0 2px 8px rgba(99,102,241,0.4));
    }

    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff 0%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #818cf8;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-sync-action {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      border-radius: var(--radius-sm);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      min-height: 44px;
      transition: all 0.2s;
    }
    .btn-sync-action:active { transform: scale(0.96); background: rgba(99, 102, 241, 0.2); }

    /* Audio Generation Banner (Method 1) */
    .audio-generator-card {
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.15) 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: var(--radius-lg);
      padding: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .audio-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .audio-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .audio-status-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .btn-generate-audio {
      background: linear-gradient(135deg, var(--accent-indigo) 0%, var(--accent-purple) 100%);
      border: none;
      color: #fff;
      padding: 14px 18px;
      border-radius: var(--radius-md);
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      width: 100%;
      min-height: 48px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
    }
    .btn-generate-audio:active { transform: scale(0.98); opacity: 0.9; }
    .btn-generate-audio:disabled { opacity: 0.6; cursor: not-allowed; }

    .audio-player-box {
      background: rgba(15, 23, 42, 0.7);
      border-radius: var(--radius-sm);
      padding: 10px;
      margin-top: 4px;
    }
    .audio-player-box audio { width: 100%; height: 36px; outline: none; }


    /* Search & Filter */
    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-input {
      flex: 1;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: #fff;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      min-height: 44px;
    }
    .search-input:focus { border-color: var(--accent-indigo); }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 4px;
      gap: 4px;
    }

    .nav-tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 4px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all 0.2s;
      min-height: 44px;
    }
    .nav-tab-btn.active {
      background: var(--accent-indigo);
      color: #fff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.4);
    }
    .nav-tab-badge {
      background: var(--bg-subtle);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 999px;
      line-height: 1.2;
    }
    .nav-tab-btn.active .nav-tab-badge {
      background: rgba(255, 255, 255, 0.28);
      color: #ffffff;
    }

    /* Sub-bar (Expand/Collapse all) */
    .sub-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .sub-bar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .expand-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
    }
    .expand-toggle input { accent-color: var(--accent-indigo); width: 16px; height: 16px; }

    /* Card List */
    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: transform 0.2s, opacity 0.2s;
    }
    .card.status-due { border-left: 4px solid var(--accent-amber); }
    .card.status-overdue { border-left: 4px solid var(--accent-rose); }
    .card.status-upcoming { border-left: 4px solid var(--accent-indigo); }
    .card.status-mastered { border-left: 4px solid var(--accent-emerald); }

    .card.dismissing {
      transform: scale(0.95);
      opacity: 0;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .card-concept-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.3;
    }

    .card-doc-origin {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: #cbd5e1;
    }
    .badge-stage { color: #818cf8; border-color: rgba(99,102,241,0.4); }
    .badge-due-today { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border-color: rgba(245, 158, 11, 0.4); }
    .badge-overdue { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.4); }

    .btn-listen-card {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      cursor: pointer;
      user-select: none;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #c7d2fe;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .btn-listen-card:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.6);
      color: #ffffff;
    }
    .btn-listen-card.is-playing {
      background: rgba(168, 85, 247, 0.25);
      border-color: rgba(168, 85, 247, 0.6);
      color: #f3e8ff;
      box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
    }
    .btn-listen-card.is-loading {
      opacity: 0.7;
      cursor: wait;
    }

    /* Preset selector per card */
    .card-preset-select {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #475569;
      color: #e2e8f0;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
      outline: none;
    }

    /* Foldable Notes */
    .card-notes-foldable {
      background: rgba(11, 15, 23, 0.6);
      border: 1px solid rgba(51, 65, 85, 0.6);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .notes-header-btn {
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }
    .notes-header-btn:hover { color: #f1f5f9; }

    .notes-content-box {
      padding: 8px 12px 12px 12px;
      font-size: 13px;
      color: #cbd5e1;
      line-height: 1.55;
      border-top: 1px solid rgba(51, 65, 85, 0.4);
      word-break: break-word;
    }
    .notes-content-box .md-code-block {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      padding: 8px 10px;
      margin: 6px 0;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
      color: #38bdf8;
      overflow-x: auto;
      white-space: pre;
    }
    .notes-content-box .md-inline-code {
      background: rgba(99, 102, 241, 0.15);
      color: #c7d2fe;
      padding: 1px 5px;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 12px;
    }
    .notes-content-box .md-h1 { font-size: 15px; font-weight: 700; color: #f8fafc; margin: 6px 0 3px; }
    .notes-content-box .md-h2 { font-size: 14px; font-weight: 700; color: #f1f5f9; margin: 5px 0 2px; }
    .notes-content-box .md-h3 { font-size: 13px; font-weight: 600; color: #e2e8f0; margin: 4px 0 2px; }
    .notes-content-box .md-h4 { font-size: 12px; font-weight: 600; color: #cbd5e1; margin: 4px 0 2px; }
    .notes-content-box .md-quote {
      border-left: 3px solid #818cf8;
      margin: 6px 0;
      padding: 4px 10px;
      background: rgba(99, 102, 241, 0.08);
      font-style: italic;
      border-radius: 0 4px 4px 0;
    }
    .notes-content-box .md-ul, .notes-content-box .md-ol { margin: 4px 0 4px 18px; padding: 0; }
    .notes-content-box .md-li { margin-bottom: 2px; }
    .notes-content-box .md-task-item { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
    .notes-content-box .md-task-check.checked { color: #34d399; }
    .notes-content-box .md-link { color: #818cf8; text-decoration: underline; }
    .notes-content-box .md-hr { border: none; border-top: 1px solid rgba(255, 255, 255, 0.1); margin: 8px 0; }
    .notes-content-box .md-image {
      max-width: 100%;
      max-height: 260px;
      height: auto;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      margin: 6px 0;
      cursor: pointer;
      display: block;
      background: rgba(15, 23, 42, 0.4);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .mobile-lightbox {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 29, 0.94);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
    }
    .mobile-lightbox-img {
      max-width: 96vw;
      max-height: 82vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: #0f172a;
    }
    .mobile-lightbox-caption {
      margin-top: 10px;
      color: #cbd5e1;
      font-size: 13px;
      text-align: center;
      max-width: 90vw;
    }
    .mobile-lightbox-close {
      position: absolute;
      top: max(env(safe-area-inset-top, 16px), 16px);
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #f8fafc;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
    }

    .notes-edit-area {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .notes-textarea {
      width: 100%;
      min-height: 80px;
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .notes-textarea.dragover {
      border-color: var(--accent-indigo);
      background: rgba(99, 102, 241, 0.1);
    }
    .btn-mobile-attach {
      background: rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s;
    }
    .btn-mobile-attach:active {
      background: rgba(255, 255, 255, 0.18);
      transform: scale(0.97);
    }

    /* Card Action Buttons */
    .card-actions-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }

    .btn-review-main {
      flex: 1;
      background: var(--accent-emerald);
      color: #064e3b;
      border: none;
      padding: 12px;
      border-radius: var(--radius-md);
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      min-height: 44px;
      transition: all 0.2s;
    }
    .btn-review-main:active { transform: scale(0.97); }

    .grading-buttons {
      display: flex;
      flex: 1;
      gap: 6px;
    }

    .btn-grade {
      flex: 1;
      padding: 12px 6px;
      border-radius: var(--radius-md);
      border: none;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      min-height: 44px;
      transition: all 0.2s;
    }
    .btn-grade:active { transform: scale(0.96); }
    .btn-hard { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }
    .btn-good { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
    .btn-easy { background: rgba(99, 102, 241, 0.2); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.4); }

    .btn-icon-action {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      width: 44px;
      height: 44px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      flex-shrink: 0;
    }
    .btn-icon-action:active { transform: scale(0.95); }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-icon { font-size: 48px; }
    .empty-title { font-family: 'Outfit', sans-serif; font-size: 20px; font-weight: 700; }
    .empty-sub { font-size: 14px; color: var(--text-muted); max-width: 320px; line-height: 1.5; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: max(24px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(30, 41, 59, 0.95);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 12px 20px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
      white-space: nowrap;
      pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* Settings Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: flex-end;
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .modal-backdrop.show { opacity: 1; pointer-events: auto; }

    .modal-sheet {
      background: var(--bg-card);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      border: 1px solid var(--border-subtle);
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: max(32px, env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .modal-backdrop.show .modal-sheet { transform: translateY(0); }

    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-title { font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 700; }
    .btn-close-modal { background: none; border: none; color: #94a3b8; font-size: 22px; cursor: pointer; }

    .setting-item { display: flex; flex-direction: column; gap: 6px; }
    .setting-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .setting-input {
      background: var(--bg-base);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: #fff;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="app-header">

    <!-- Pull to Refresh Bar (Native Touch Gestures on iOS) -->

    <!-- Method 1: Direct Mobile Audio Generation Banner -->

      <button id="btn-generate-audio" class="btn-generate-audio">

    <!-- Search Box -->
    <div class="search-row">
      <input type="text" id="search-input" class="search-input" placeholder="🔍 Search sections or notes...">

    <!-- Navigation Tabs (Concise Primary Filter Navigation with Badges) -->
    <nav class="nav-tabs">

    <!-- Controls Sub-bar -->

    <!-- Cards Container -->
    <main class="cards-list" id="cards-container">

    </main>

    <!-- Empty State -->
    <div class="empty-state hidden" id="empty-state">

  <!-- Settings Sheet -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-sheet">
      <div class="modal-head">

      </div>

      <div id="pwa-install-hint" class="install-hint-box" style="background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: var(--radius-sm); padding: 10px 12px; font-size: 12px; color: var(--text-muted); line-height: 1.5; margin-bottom: 12px;">
        <span id="pwa-install-text">📱 Add to Home Screen for fullscreen standalone access.</span>

      <div class="setting-item">

      </div>

      <div class="setting-item">
        <label class="setting-label">TTS Voice</label>
        <select id="set-tts-voice" class="setting-input">
          <option value="nova">Nova (Warm & Friendly Female)</option>
          <option value="alloy">Alloy (Neutral & Balanced)</option>
          <option value="echo">Echo (Calm Male)</option>
          <option value="fable">Fable (British Accent)</option>
          <option value="onyx">Onyx (Deep Male)</option>
          <option value="shimmer">Shimmer (Bright Female)</option>
          <option value="en-US-Neural2-F">Google Neural2 Female</option>
          <option value="en-US-Neural2-D">Google Neural2 Male</option>
        </select>
      </div>

      <button id="btn-save-settings" class="btn-generate-audio" style="margin-top: 8px;">
        💾 Save Settings
      </button>

      <button id="btn-force-reload" class="btn-generate-audio" style="margin-top: 6px; background: rgba(59, 130, 246, 0.15); border: 1px solid #3b82f6; color: #93c5fd;">
        🔄 Force Reload App (Bust Cache)
      </button>

      <button id="btn-copy-setup-link" class="btn-generate-audio" style="margin-top: 6px; background: rgba(99, 102, 241, 0.15); border: 1px solid var(--accent-indigo); color: #c7d2fe;">
        🔗 Copy Home Screen Setup Link
      </button>

      <button id="btn-paste-setup-link" class="btn-generate-audio" style="margin-top: 6px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-emerald); color: #a7f3d0;">
        📋 Paste Pairing URL / Link
      </button>

  <!-- Mobile Image Lightbox Overlay -->
  <div id="mobile-lightbox" class="mobile-lightbox" style="display: none;">
    <button class="mobile-lightbox-close" id="btn-close-mobile-lightbox" aria-label="Close">✕</button>
    <img id="mobile-lightbox-img" class="mobile-lightbox-img" src="" alt="Enlarged note image">
    <div id="mobile-lightbox-caption" class="mobile-lightbox-caption"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast">✅ Sync Complete</div>

  <script>
    // State
    let items = [];
    let currentTab = 'due';
    let searchQuery = '';
    let areAllExpanded = false;
    let authConfig = {
      githubOwner: '',
      githubRepo: 'mindspur-podcast',
      githubToken: '',
      ttsProvider: 'openai',
      ttsApiKey: '',
      ttsVoice: 'nova',
      pauseSeconds: 3,
      includeDocOrigin: false,
      reviewMode: 'simple'
    };

    const INTERVALS = {
      standard: [1, 3, 7, 14, 30],
      intensive: [1, 2, 4, 7, 15],
      longterm: [1, 3, 7, 14, 30, 60, 90]
    };

    // Browser & Device Environment Detection
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    const isCriOS = navigator.userAgent.includes('CriOS');
    const isSafari = isIOS && !isCriOS && /Safari/.test(navigator.userAgent);
    const isStandalone = Boolean(window.navigator.standalone || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches));

    window.__MOBILE_ENV__ = {
      isIOS,
      isCriOS,
      isSafari,
      isStandalone,
      screenWidth: window.innerWidth,
      screenHeight: window.innerHeight,
      dpr: window.devicePixelRatio || 1
    };

    function updateInstallHint() {
      const hintBox = document.getElementById('pwa-install-hint');
      const hintText = document.getElementById('pwa-install-text');
      if (!hintBox || !hintText) return;
      if (isStandalone) {
        hintBox.style.display = 'none';
      } else if (isCriOS) {
        hintText.innerHTML = '📱 <strong>iPhone Chrome</strong>: Tap <strong>Menu (⋯)</strong> or Share → <strong>Add to Home Screen</strong> for fullscreen app experience.';
      } else if (isSafari) {
        hintText.innerHTML = '📱 <strong>iPhone Safari</strong>: Tap <strong>Share (⎋)</strong> → <strong>Add to Home Screen</strong>. (Settings & credentials are automatically preserved in the home screen shortcut!)';
      }
    }

    function getSerializedAuthHash() {
      if (!authConfig || !authConfig.githubToken) return '';
      const payload = {
        o: authConfig.githubOwner || '',
        r: authConfig.githubRepo || 'mindspur-podcast',
        t: authConfig.githubToken || '',
        b: authConfig.githubApiBase || 'https://api.github.com',
        p: authConfig.ttsProvider || 'openai',
        k: authConfig.ttsApiKey || '',
        v: authConfig.ttsVoice || 'nova',
        s: authConfig.pauseSeconds || 3,
        d: authConfig.includeDocOrigin === true,
        m: authConfig.reviewMode || 'simple'
      };
      return '#auth=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(payload)))));
    }

    function ensureAuthHashInUrl(force = false) {
      if (!authConfig || !authConfig.githubToken) return;
      if (!force && window.location.hash && window.location.hash.includes('auth=')) return;
      const expectedHash = getSerializedAuthHash();
      if (!expectedHash) return;
      if (window.location.hash !== expectedHash) {
        if (history.replaceState) {
          history.replaceState(null, '', window.location.pathname + expectedHash);
        } else {
          window.location.hash = expectedHash;
        }
      }
    }

    function updateManifestStartUrl() {
      try {
        const manifestEl = document.getElementById('app-manifest') || document.querySelector('link[rel="manifest"]');
        if (!manifestEl) return;
        const currentHash = window.location.hash || getSerializedAuthHash();
        const startUrl = window.location.pathname + (currentHash || '');
        const manifestObj = {
          name: 'MindSpur Reviews',
          short_name: 'MindSpur',
          description: 'Spaced repetition reviews and audio podcast flashcards for iPhone.',
          start_url: startUrl,
          display: 'standalone',
          orientation: 'portrait-primary',
          background_color: '#0b0f17',
          theme_color: '#1e1b4b',
          icons: [{
            src: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%236366f1"/><text x="50" y="66" font-size="52" text-anchor="middle">🧠</text></svg>',
            sizes: '192x192 512x512',
            type: 'image/svg+xml',
            purpose: 'any maskable'
          }]
        };
        const blob = new Blob([JSON.stringify(manifestObj, null, 2)], { type: 'application/manifest+json' });
        manifestEl.href = URL.createObjectURL(blob);
      } catch (_) {}
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', () => {
      updateInstallHint();
      loadAuthFromHashOrStorage();
      loadLocalItems();
      initEvents();
      if (authConfig.githubToken && authConfig.githubOwner) {
        performSync();
      }
    });

    function loadAuthFromHashOrStorage() {
      // 1. Check URL hash for pairing payload from laptop QR code
      const hash = window.location.hash;
      let hashLoaded = false;
      if (hash && hash.includes('auth=')) {
        try {
          const match = /#?auth=([^&]+)/.exec(hash);
          if (match) {
            const rawB64 = decodeURIComponent(match[1]);
            const jsonStr = decodeURIComponent(escape(atob(rawB64.replace(/\s/g, ''))));
            const p = JSON.parse(jsonStr);
            authConfig = {
              githubOwner: p.o || authConfig.githubOwner,
              githubRepo: p.r || authConfig.githubRepo,
              githubToken: p.t || authConfig.githubToken,
              githubApiBase: p.b || authConfig.githubApiBase || 'https://api.github.com',
              ttsProvider: p.p || authConfig.ttsProvider,
              ttsApiKey: p.k || authConfig.ttsApiKey,
              ttsVoice: p.v || authConfig.ttsVoice,
              pauseSeconds: p.s || 3,
              includeDocOrigin: p.d === true,
              reviewMode: p.m || 'simple'
            };
            localStorage.setItem('mindspur_auth', JSON.stringify(authConfig));
            hashLoaded = true;
            showToast('✅ Paired successfully with your laptop!');
          }
        } catch (err) {
          console.error('Failed to parse auth hash:', err);
        }
      }

      if (!hashLoaded) {
        const stored = localStorage.getItem('mindspur_auth');
        if (stored) {
          try { authConfig = { ...authConfig, ...JSON.parse(stored) }; } catch (_) {}
        }
      }

      // CRITICAL FOR IOS "ADD TO HOME SCREEN" CREDENTIAL PROPAGATION:
      // Mobile Safari browser and iOS Standalone PWA run in strictly isolated WebKit storage containers.
      // Mobile Safari localStorage is NEVER shared with the Standalone Home Screen PWA.
      // Therefore, the bookmark URL itself is the ONLY bridge to transfer credentials to the Home Screen PWA.
      if (!isStandalone) {
        // While viewing in Safari browser, preserve/re-attach #auth=... in the URL bar
        ensureAuthHashInUrl();
        updateManifestStartUrl();
      } else {
        // Once launched as a Standalone PWA on the home screen, credentials are safe in standalone localStorage:
        if (history.replaceState && window.location.hash) {
          history.replaceState(null, '', window.location.pathname);
        }
      }

      populateSettingsModal();
    }

    let deletedIds = [];
    function loadDeletedIds() {
      const stored = localStorage.getItem('mindspur_deleted_ids');
      if (stored) {
        try { deletedIds = JSON.parse(stored); } catch (_) { deletedIds = []; }
      }
      if (!Array.isArray(deletedIds)) deletedIds = [];
    }

    function saveDeletedIds() {
      localStorage.setItem('mindspur_deleted_ids', JSON.stringify(deletedIds));
    }

    function loadLocalItems() {
      loadDeletedIds();
      const stored = localStorage.getItem('mindspur_items');
      if (stored) {
        try { items = JSON.parse(stored); } catch (_) { items = []; }
      }
      if (deletedIds.length > 0) {
        const delSet = new Set(deletedIds);
        items = items.filter(i => !delSet.has(i.id));
      }
      render();
    }

    function saveLocalItems() {
      localStorage.setItem('mindspur_items', JSON.stringify(items));
    }

    function initEvents() {
      // Tabs
      document.querySelectorAll('.nav-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentTab = btn.dataset.tab;
          document.getElementById('tab-indicator-title').textContent = {
            due: 'Items Due Today',
            upcoming: 'Upcoming Schedule',
            mastered: 'Mastered Sections',
            all: 'All Tracked Sections'
          }[currentTab];
          render();
        });
      });

      // Search
      document.getElementById('search-input').addEventListener('input', (e) => {
        searchQuery = e.target.value.toLowerCase().trim();
        render();
      });

      // Expand all
      const cbExpand = document.getElementById('cb-expand-all');
      cbExpand.addEventListener('change', (e) => {
        areAllExpanded = e.target.checked;
        document.getElementById('label-expand-all').textContent = areAllExpanded ? 'Collapse Notes' : 'Expand Notes';
        render();
      });

      // Sync button
      document.getElementById('btn-sync').addEventListener('click', performSync);

      // Settings modal
      const modal = document.getElementById('settings-modal');
      document.getElementById('btn-settings').addEventListener('click', () => modal.classList.add('show'));
      document.getElementById('btn-close-modal').addEventListener('click', () => modal.classList.remove('show'));
      document.getElementById('btn-save-settings').addEventListener('click', () => {
        authConfig.reviewMode = document.getElementById('set-review-mode').value;
        authConfig.githubOwner = document.getElementById('set-gh-owner').value.trim();
        authConfig.githubRepo = document.getElementById('set-gh-repo').value.trim();
        authConfig.githubToken = document.getElementById('set-gh-token').value.trim();
        authConfig.ttsProvider = document.getElementById('set-tts-provider').value;
        authConfig.ttsApiKey = document.getElementById('set-tts-key').value.trim();
        authConfig.ttsVoice = document.getElementById('set-tts-voice').value;
        localStorage.setItem('mindspur_auth', JSON.stringify(authConfig));
        if (!isStandalone) {
          ensureAuthHashInUrl(true);
          updateManifestStartUrl();
        }
        modal.classList.remove('show');
        showToast('⚙️ Settings saved!');
        render();
        if (authConfig.githubToken) performSync();
      });

      const btnCopyLink = document.getElementById('btn-copy-setup-link');
      if (btnCopyLink) {
        btnCopyLink.addEventListener('click', () => {
          const url = window.location.origin + window.location.pathname + getSerializedAuthHash();
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(url).then(() => {
              showToast('📋 Setup link copied to clipboard!');
            }).catch(() => {
              prompt('Copy this setup link:', url);
            });
          } else {
            prompt('Copy this setup link:', url);
          }
        });
      }

      const btnPasteLink = document.getElementById('btn-paste-setup-link');
      if (btnPasteLink) {
        btnPasteLink.addEventListener('click', async () => {
          let text = '';
          if (navigator.clipboard && navigator.clipboard.readText) {
            try {
              text = await navigator.clipboard.readText();
            } catch (_) {}
          }
          if (!text || !text.includes('auth=')) {
            text = prompt('Paste your iPhone Pairing URL (from laptop dashboard):', text || '');
          }
          if (text && text.includes('auth=')) {
            const hashIdx = text.indexOf('#');
            const hash = hashIdx !== -1 ? text.substring(hashIdx) : text;
            window.location.hash = hash;
            loadAuthFromHashOrStorage();
            modal.classList.remove('show');
            showToast('✅ Paired & loaded credentials!');
            render();
            if (authConfig.githubToken) performSync();
          } else if (text) {
            showToast('⚠️ No valid auth credentials found in link');
          }
        });
      }

      const btnForceReload = document.getElementById('btn-force-reload');
      if (btnForceReload) {
        btnForceReload.addEventListener('click', () => {
          showToast('Refreshing to latest version...');
          setTimeout(() => {
            window.location.href = window.location.origin + window.location.pathname + '?_t=' + Date.now() + (window.location.hash || '');
          }, 300);
        });
      }

      // Method 1: Generate Audio
      document.getElementById('btn-generate-audio').addEventListener('click', handleMobileAudioGeneration);

      // Real-time synchronization listeners: app/tab focus, visibility change, and navigation (event-driven, no periodic polling)
      window.addEventListener('focus', performSync);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) performSync();
      });

      // Bfcache support for Safari back/forward navigation
      window.addEventListener('pageshow', (event) => {
        if (event.persisted) {
          loadAuthFromHashOrStorage();
          loadLocalItems();
          if (authConfig.githubToken && authConfig.githubOwner) {
            performSync();
          }
        }
      });

      window.addEventListener('popstate', () => {
        loadAuthFromHashOrStorage();
        loadLocalItems();
        if (authConfig.githubToken && authConfig.githubOwner) performSync();
      });

      window.addEventListener('hashchange', () => {
        loadAuthFromHashOrStorage();
        loadLocalItems();
        if (authConfig.githubToken && authConfig.githubOwner) performSync();
      });

      // In-app touch pull-down-to-refresh
      setupPullToRefresh();
      setupMobileLightbox();
    }

    function setupPullToRefresh() {
      const indicator = document.getElementById('pull-refresh-indicator');
      const pullIcon = document.getElementById('pull-icon');
      const pullText = document.getElementById('pull-text');
      if (!indicator || !pullIcon || !pullText) return;

      let startY = 0;
      let pulling = false;

      window.addEventListener('touchstart', (e) => {
        if (window.scrollY <= 4 && e.touches.length === 1) {
          startY = e.touches[0].clientY;
          pulling = true;
        } else {
          pulling = false;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (!pulling || e.touches.length !== 1) return;
        const currentY = e.touches[0].clientY;
        const diff = currentY - startY;

        if (diff > 35 && window.scrollY <= 4) {
          indicator.classList.add('visible');
          if (diff > 75) {
            pullIcon.textContent = '↑';
            pullText.textContent = 'Release to refresh...';
          } else {
            pullIcon.textContent = '↓';
            pullText.textContent = 'Pull to refresh...';
          }
        } else if (diff <= 35) {
          indicator.classList.remove('visible');
        }
      }, { passive: true });

      window.addEventListener('touchend', async () => {
        if (!pulling) return;
        pulling = false;
        if (indicator.classList.contains('visible') && pullText.textContent.includes('Release')) {
          indicator.classList.add('refreshing');
          pullIcon.textContent = '🔄';
          pullText.textContent = 'Refreshing & syncing...';

          loadAuthFromHashOrStorage();
          loadLocalItems();
          if (authConfig.githubToken && authConfig.githubOwner) {
            await performSync();
          }

          setTimeout(() => {
            indicator.classList.remove('visible', 'refreshing');
            pullIcon.textContent = '↓';
            pullText.textContent = 'Pull down to refresh';
          }, 450);
        } else {
          indicator.classList.remove('visible');
        }
      }, { passive: true });
    }

    function populateSettingsModal() {
      document.getElementById('set-review-mode').value = authConfig.reviewMode || 'simple';
      document.getElementById('set-gh-owner').value = authConfig.githubOwner || '';
      document.getElementById('set-gh-repo').value = authConfig.githubRepo || 'mindspur-podcast';
      document.getElementById('set-gh-token').value = authConfig.githubToken || '';
      document.getElementById('set-tts-provider').value = authConfig.ttsProvider || 'openai';
      document.getElementById('set-tts-key').value = authConfig.ttsApiKey || '';
      document.getElementById('set-tts-voice').value = authConfig.ttsVoice || 'nova';
    }

    let isSyncing = false;
    let syncPending = false;

    // Two-Way GitHub Sync
    async function performSync() {
      const { githubOwner: owner, githubRepo: repo, githubToken: token } = authConfig;
      if (!owner || !repo || !token) {
        showToast('⚠️ Tap ⚙️ to set up GitHub credentials');
        return;
      }

      if (isSyncing) {
        syncPending = true;
        return;
      }
      isSyncing = true;
      syncPending = false;

      const syncIcon = document.getElementById('sync-icon');
      const syncText = document.getElementById('sync-text');
      syncIcon.textContent = '⏳';
      syncText.textContent = 'Syncing...';

      loadDeletedIds();
      const storedLocal = localStorage.getItem('mindspur_items');
      if (storedLocal) {
        try { items = JSON.parse(storedLocal); } catch (_) { items = []; }
      }
      if (deletedIds.length > 0) {
        const delSet = new Set(deletedIds);
        items = items.filter(i => !delSet.has(i.id));
      }

      try {
        const path = 'data/reminders.json';
        const apiBase = (authConfig && authConfig.githubApiBase) ? authConfig.githubApiBase : 'https://api.github.com';
        const cacheBuster = Date.now() + '_' + Math.random().toString(36).substring(2, 7);
        const getUrl = apiBase + '/repos/' + owner + '/' + repo + '/contents/' + path + '?_t=' + cacheBuster;
        const putUrl = apiBase + '/repos/' + owner + '/' + repo + '/contents/' + path;
        const maxRetries = 2;

        for (let attempt = 0; attempt <= maxRetries; attempt++) {
          if (attempt > 0) {
            await new Promise(r => setTimeout(r, (attempt * 200) + Math.floor(Math.random() * 50)));
          }

          // 1. Fetch remote data
          const res = await fetch(getUrl, {
            cache: 'no-store',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github.v3+json'
            }
          });

          let remoteItems = [];
          let remoteDeletedIds = [];
          let remoteSha = null;

          if (res.ok) {
            const remoteData = await res.json();
            remoteSha = remoteData.sha;
            if (remoteData.content) {
              const raw = decodeURIComponent(escape(atob(remoteData.content.replace(/\s/g, ''))));
              const parsed = JSON.parse(raw);
              remoteItems = Array.isArray(parsed.items) ? parsed.items : (Array.isArray(parsed) ? parsed : []);
              remoteDeletedIds = Array.isArray(parsed.deletedIds) ? parsed.deletedIds : [];

              // Synchronize cloud settings into mobile authConfig
              if (parsed.settings && typeof parsed.settings === 'object') {
                let settingsChanged = false;
                ['reviewMode', 'ttsProvider', 'ttsVoice', 'pauseSeconds', 'includeDocOrigin'].forEach(k => {
                  if (parsed.settings[k] !== undefined && authConfig[k] !== parsed.settings[k]) {
                    authConfig[k] = parsed.settings[k];
                    settingsChanged = true;
                  }
                });
                if (settingsChanged) {
                  localStorage.setItem('mindspur_auth', JSON.stringify(authConfig));
                  populateSettingsModal();
                  if (!isStandalone) ensureAuthHashInUrl(true);
                }
              }
            }
          }

          // Merge deletedIds
          const allDeleted = Array.from(new Set([...(deletedIds || []), ...(remoteDeletedIds || [])]));
          deletedIds = allDeleted;
          saveDeletedIds();

          // 2. Client-side merge
          items = mergeLists(items, remoteItems, deletedIds);
          saveLocalItems();

          // 3. Push merged back to GitHub (strip credentials - never commit tokens or keys!)
          const cloudSettings = {
            reviewMode: authConfig.reviewMode || 'simple',
            ttsProvider: authConfig.ttsProvider || 'openai',
            ttsVoice: authConfig.ttsVoice || 'nova',
            pauseSeconds: authConfig.pauseSeconds || 3,
            includeDocOrigin: authConfig.includeDocOrigin || false
          };
          const payload = {
            version: 1,
            updatedAt: new Date().toISOString(),
            items: items,
            deletedIds: deletedIds,
            settings: cloudSettings
          };
          const putBody = {
            message: 'Sync from iPhone (' + items.length + ' items)',
            content: btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))))
          };
          if (remoteSha) putBody.sha = remoteSha;

          const putRes = await fetch(putUrl, {
            method: 'PUT',
            headers: {
              'Authorization': 'Bearer ' + token,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(putBody)
          });

          if (!putRes.ok) {
            let detail = '';
            try {
              const errJson = await putRes.json();
              if (errJson.message) detail = ': ' + errJson.message;
            } catch (_) {}

            if (putRes.status === 409 && attempt < maxRetries) {
              continue;
            }
            throw new Error('HTTP ' + putRes.status + detail);
          }

          showToast('🟢 Synced (' + items.length + ' items)');
          break;
        }
      } catch (err) {
        console.error('Sync failed:', err);
        showToast('⚠️ Sync error: ' + err.message);
      } finally {
        isSyncing = false;
        syncIcon.textContent = '🔄';
        syncText.textContent = 'Sync';
        render();
        if (syncPending) {
          syncPending = false;
          setTimeout(performSync, 100);
        }
      }
    }

    function mergeLists(local, remote, deleted = []) {
      const deletedSet = new Set(deleted || []);
      const map = new Map();

      local.forEach(i => {
        if (i && i.id && !deletedSet.has(i.id)) {
          map.set(i.id, { ...i });
        }
      });

      remote.forEach(r => {
        if (!r || !r.id || deletedSet.has(r.id)) return;

        if (!map.has(r.id)) {
          map.set(r.id, r);
        } else {
          const l = map.get(r.id);
          const lTime = (l.lastReviewedDate || l.lastReviewedAt) ? new Date(l.lastReviewedDate || l.lastReviewedAt).getTime() : 0;
          const rTime = (r.lastReviewedDate || r.lastReviewedAt) ? new Date(r.lastReviewedDate || r.lastReviewedAt).getTime() : 0;
          const lUp = l.updatedAt ? new Date(l.updatedAt).getTime() : (l.createdAt ? new Date(l.createdAt).getTime() : 0);
          const rUp = r.updatedAt ? new Date(r.updatedAt).getTime() : (r.createdAt ? new Date(r.createdAt).getTime() : 0);

          let reviewWinner = l;
          if (rTime > lTime) {
            reviewWinner = r;
          } else if (lTime > rTime) {
            reviewWinner = l;
          } else {
            const lStage = l.currentStage || 0;
            const rStage = r.currentStage || 0;
            if (rStage > lStage) {
              reviewWinner = r;
            } else if (lStage > rStage) {
              reviewWinner = l;
            } else {
              // Same stage and review time: whichever was updated later wins the review state (e.g. "Review Today")
              reviewWinner = (rUp > lUp) ? r : l;
            }
          }

          const merged = {
            ...l,
            currentStage: reviewWinner.currentStage,
            nextReviewDate: reviewWinner.nextReviewDate,
            lastReviewedDate: reviewWinner.lastReviewedDate || reviewWinner.lastReviewedAt || null,
            lastReviewedAt: reviewWinner.lastReviewedAt || reviewWinner.lastReviewedDate || null,
            isMastered: reviewWinner.isMastered,
            easeFactor: reviewWinner.easeFactor !== undefined ? reviewWinner.easeFactor : l.easeFactor
          };

          // Determine notes winner (field-level timestamp avoids review milestone discarding newer notes)
          const lNotesUp = l.notesUpdatedAt ? new Date(l.notesUpdatedAt).getTime() : 0;
          const rNotesUp = r.notesUpdatedAt ? new Date(r.notesUpdatedAt).getTime() : 0;

          if (rNotesUp > lNotesUp) {
            if (r.notes !== undefined) merged.notes = r.notes;
            merged.notesUpdatedAt = r.notesUpdatedAt;
          } else if (lNotesUp > rNotesUp) {
            if (l.notes !== undefined) merged.notes = l.notes;
            merged.notesUpdatedAt = l.notesUpdatedAt;
          } else {
            if (rUp > lUp) {
              if (r.notes !== undefined) merged.notes = r.notes;
            } else {
              if (!merged.notes && r.notes) merged.notes = r.notes;
            }
          }

          // Determine curve and podcast metadata winner
          if (rUp > lUp) {
            if (r.presetKey) merged.presetKey = r.presetKey;
            if (r.intervals) merged.intervals = r.intervals;
            if (r.totalStages) merged.totalStages = r.totalStages;
            if (r.includeInPodcast !== undefined) merged.includeInPodcast = r.includeInPodcast;
            merged.updatedAt = r.updatedAt;
          } else {
            if (r.includeInPodcast !== undefined && l.includeInPodcast === undefined) {
              merged.includeInPodcast = r.includeInPodcast;
            }
            merged.updatedAt = l.updatedAt || new Date().toISOString();
          }

          map.set(r.id, merged);
        }
      });
      return Array.from(map.values());
    }

    // Audio Chunk Cache & MP3 Stitching for Lazy Synthesis & Cost Savings
    const MobileAudioChunkCache = {
      getChunk(chunkKey) {
        try {
          const raw = localStorage.getItem('mindspur_audio_chunks');
          if (!raw) return null;
          const cache = JSON.parse(raw);
          return cache[chunkKey] ? (cache[chunkKey].audioBase64 || cache[chunkKey]) : null;
        } catch (_) {
          return null;
        }
      },
      saveChunk(chunkKey, audioBase64) {
        try {
          const raw = localStorage.getItem('mindspur_audio_chunks');
          const cache = raw ? JSON.parse(raw) : {};
          cache[chunkKey] = {
            audioBase64: audioBase64,
            updatedAt: Date.now()
          };
          localStorage.setItem('mindspur_audio_chunks', JSON.stringify(cache));
          return true;
        } catch (_) {
          return false;
        }
      }
    };

    function computeMobileReminderAudioHash(item, config) {
      const provider = config.ttsProvider || config.providerId || 'openai';
      const voice = config.ttsVoice || config.voiceName || 'nova';
      const pause = config.pauseSeconds !== undefined ? config.pauseSeconds : 3;
      const includeDoc = Boolean(config.includeDocOrigin);
      const title = (item.sectionTitle || item.title || '').trim();
      const doc = includeDoc ? (item.docTitle || '').trim() : '';
      const notes = (item.notes || '').trim();
      const excerpt = (item.selectedText || '').trim();

      const rawKey = [provider, voice, pause, includeDoc ? '1' : '0', title, doc, notes, excerpt].join('|');
      let h = 0x811c9dc5;
      for (let i = 0; i < rawKey.length; i++) {
        h ^= rawKey.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      const hex = (h >>> 0).toString(16).padStart(8, '0');
      const safeId = String(item.id || 'rem').replace(/[^a-zA-Z0-9_-]/g, '_');
      return 'chunk_' + safeId + '_' + hex;
    }

    function stripId3Frames(uint8Array) {
      let offset = 0;
      const len = uint8Array.length;
      if (len >= 10 && uint8Array[0] === 0x49 && uint8Array[1] === 0x44 && uint8Array[2] === 0x33) {
        const hasFooter = (uint8Array[5] & 0x10) !== 0;
        const tagSize = ((uint8Array[6] & 0x7f) << 21) |
                        ((uint8Array[7] & 0x7f) << 14) |
                        ((uint8Array[8] & 0x7f) << 7) |
                        (uint8Array[9] & 0x7f);
        offset = 10 + tagSize + (hasFooter ? 10 : 0);
      }
      while (offset < len - 1) {
        if (uint8Array[offset] === 0xFF && (uint8Array[offset + 1] & 0xE0) === 0xE0) {
          break;
        }
        offset++;
      }
      let end = len;
      if (end >= 128 && uint8Array[end - 128] === 0x54 && uint8Array[end - 127] === 0x41 && uint8Array[end - 126] === 0x47) {
        end -= 128;
      }
      if (offset < end) {
        return uint8Array.subarray(offset, end);
      }
      return uint8Array;
    }

    function concatMp3Base64List(base64List) {
      if (!base64List || base64List.length === 0) return '';
      const valid = base64List.filter(Boolean);
      if (valid.length === 0) return '';
      if (valid.length === 1) return valid[0];

      const buffers = valid.map(b64 => {
        const binary = atob(b64);
        const len = binary.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binary.charCodeAt(i);
        }
        return stripId3Frames(bytes);
      });

      const totalLength = buffers.reduce((acc, b) => acc + b.length, 0);
      const result = new Uint8Array(totalLength);
      let cur = 0;
      for (const b of buffers) {
        result.set(b, cur);
        cur += b.length;
      }

      let binary = '';
      for (let i = 0; i < result.length; i += 8192) {
        binary += String.fromCharCode.apply(null, result.subarray(i, Math.min(i + 8192, result.length)));
      }
      return btoa(binary);
    }

    async function synthesizeSingleReminderAudioMobile(item, providerId, config) {
      const { ttsApiKey, ttsVoice, pauseSeconds, includeDocOrigin } = config;
      const title = item.sectionTitle || item.title || 'Concept';
      const origin = (includeDocOrigin && item.docTitle) ? (' From ' + item.docTitle + '.') : '';
      const pauseSec = pauseSeconds !== undefined ? pauseSeconds : 3;

      if (providerId === 'google') {
        const escTitle = title.replace(/&/g, '&amp;').replace(/</g, '&lt;');
        const escOrigin = (includeDocOrigin && item.docTitle) ? (' From ' + item.docTitle.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '.') : '';
        let ssml = '<speak><s>Review: ' + escTitle + '.' + escOrigin + '</s>';
        ssml += '<break time="' + pauseSec + 's"/>';
        if (item.notes) {
          ssml += '<s>Notes: ' + item.notes.replace(/&/g, '&amp;').replace(/</g, '&lt;') + '</s>';
          ssml += '<break time="1s"/>';
        }
        ssml += '</speak>';

        const res = await fetch('https://texttospeech.googleapis.com/v1/text:synthesize?key=' + encodeURIComponent(ttsApiKey), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            input: { ssml },
            voice: { languageCode: 'en-US', name: ttsVoice || 'en-US-Neural2-F' },
            audioConfig: { audioEncoding: 'MP3' }
          })
        });
        if (!res.ok) throw new Error('Google TTS error: ' + res.status);
        const data = await res.json();
        return data.audioContent;
      } else {
        // OpenAI TTS
        let script = 'Review: ' + title + '.' + origin + '\n\n...\n\n';
        if (item.notes) script += 'Notes: ' + item.notes.trim() + '\n\n';

        const res = await fetch('https://api.openai.com/v1/audio/speech', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + ttsApiKey,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'tts-1',
            input: script,
            voice: ttsVoice || 'nova',
            response_format: 'mp3'
          })
        });
        if (!res.ok) throw new Error('OpenAI TTS error: ' + res.status);
        const buffer = await res.arrayBuffer();
        const bytes = new Uint8Array(buffer);
        let binary = '';
        for (let i = 0; i < bytes.length; i += 8192) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, Math.min(i + 8192, bytes.length)));
        }
        return btoa(binary);
      }
    }

    let currentMobileAudio = null;
    let currentMobileAudioId = null;

    async function handlePlayCardAudioMobile(item, btn) {
      if (currentMobileAudio && currentMobileAudioId === item.id) {
        currentMobileAudio.pause();
        currentMobileAudio = null;
        currentMobileAudioId = null;
        btn.classList.remove('is-playing');
        btn.innerHTML = '<span class="listen-icon">🔊</span><span class="listen-label">Listen</span>';
        return;
      }

      if (currentMobileAudio) {
        currentMobileAudio.pause();
        currentMobileAudio = null;
        currentMobileAudioId = null;
        const oldBtn = document.querySelector('.btn-listen-card.is-playing');
        if (oldBtn) {
          oldBtn.classList.remove('is-playing');
          oldBtn.innerHTML = '<span class="listen-icon">🔊</span><span class="listen-label">Listen</span>';
        }
      }

      const { ttsProvider, ttsApiKey, ttsVoice, pauseSeconds, includeDocOrigin } = authConfig;
      if (!ttsApiKey) {
        alert('Please configure your TTS API Key in ⚙️ Settings to listen to audio.');
        return;
      }

      const config = {
        ttsProvider: ttsProvider || 'openai',
        ttsApiKey,
        ttsVoice: ttsVoice || (ttsProvider === 'openai' ? 'nova' : 'en-US-Neural2-F'),
        pauseSeconds: pauseSeconds !== undefined ? pauseSeconds : 3,
        includeDocOrigin: Boolean(includeDocOrigin)
      };

      const chunkKey = computeMobileReminderAudioHash(item, config);
      let audioB64 = MobileAudioChunkCache.getChunk(chunkKey);

      if (!audioB64) {
        btn.classList.add('is-loading');
        btn.innerHTML = '<span class="listen-icon">⏳</span><span class="listen-label">Loading...</span>';
        try {
          audioB64 = await synthesizeSingleReminderAudioMobile(item, config.ttsProvider, config);
          MobileAudioChunkCache.saveChunk(chunkKey, audioB64);
        } catch (err) {
          btn.classList.remove('is-loading');
          btn.innerHTML = '<span class="listen-icon">🔊</span><span class="listen-label">Listen</span>';
          alert('Failed to synthesize audio: ' + (err.message || err));
          return;
        } finally {
          btn.classList.remove('is-loading');
        }
      }

      try {
        currentMobileAudio = new Audio('data:audio/mp3;base64,' + audioB64);
        currentMobileAudioId = item.id;
        btn.classList.add('is-playing');
        btn.innerHTML = '<span class="listen-icon">⏸️</span><span class="listen-label">Pause</span>';

        currentMobileAudio.onended = () => {
          btn.classList.remove('is-playing');
          btn.innerHTML = '<span class="listen-icon">🔊</span><span class="listen-label">Listen</span>';
          currentMobileAudio = null;
          currentMobileAudioId = null;
        };

        currentMobileAudio.onerror = () => {
          btn.classList.remove('is-playing');
          btn.innerHTML = '<span class="listen-icon">🔊</span><span class="listen-label">Listen</span>';
          currentMobileAudio = null;
          currentMobileAudioId = null;
        };

        await currentMobileAudio.play();
      } catch (err) {
        btn.classList.remove('is-playing');
        btn.innerHTML = '<span class="listen-icon">🔊</span><span class="listen-label">Listen</span>';
        currentMobileAudio = null;
        currentMobileAudioId = null;
      }
    }

    // Method 1: Direct Mobile Audio Generation
    async function handleMobileAudioGeneration() {
      const btn = document.getElementById('btn-generate-audio');
      const { githubOwner: owner, githubRepo: repo, githubToken: ghToken, ttsProvider, ttsApiKey, ttsVoice, pauseSeconds, includeDocOrigin } = authConfig;

      if (!ghToken || !owner) {
        alert('GitHub credentials missing. Please pair your iPhone or enter them in ⚙️ Settings.');
        return;
      }
      if (!ttsApiKey) {
        alert('TTS API Key missing. Please enter your API Key in ⚙️ Settings.');
        return;
      }

      const dueItems = items.filter(i => {
        const s = getItemStatus(i);
        return (s === 'due' || s === 'overdue') && i.includeInPodcast !== false;
      });

      if (dueItems.length === 0) {
        alert('No items due today with Audio ON.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> Synthesizing Speech...';

      try {
        let chunks = [];
        let reusedCount = 0;
        let synthesizedCount = 0;

        for (const it of dueItems) {
          const config = {
            ttsProvider: ttsProvider || 'openai',
            ttsApiKey,
            ttsVoice: ttsVoice || (ttsProvider === 'openai' ? 'nova' : 'en-US-Neural2-F'),
            pauseSeconds: pauseSeconds !== undefined ? pauseSeconds : 3,
            includeDocOrigin: Boolean(includeDocOrigin)
          };
          const chunkKey = computeMobileReminderAudioHash(it, config);
          let chunkB64 = MobileAudioChunkCache.getChunk(chunkKey);
          if (chunkB64) {
            reusedCount++;
          } else {
            chunkB64 = await synthesizeSingleReminderAudioMobile(it, config.ttsProvider, config);
            MobileAudioChunkCache.saveChunk(chunkKey, chunkB64);
            synthesizedCount++;
          }
          if (chunkB64) chunks.push(chunkB64);
        }

        let audioBase64 = '';
        if (chunks.length === 1) {
          audioBase64 = chunks[0];
        } else if (chunks.length > 1) {
          audioBase64 = concatMp3Base64List(chunks);
        }

        btn.innerHTML = '<span>⏳</span> Uploading to GitHub...';

        const todayStr = new Date().toISOString().split('T')[0];
        const ts = Math.floor(Date.now() / 1000);
        const audioPath = 'audio/' + todayStr + '_reviews_' + ts + '.mp3';
        const putAudioUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/' + audioPath;

        await fetch(putAudioUrl, {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + ghToken,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Publish audio for ' + todayStr + ' (v' + ts + ')',
            content: audioBase64
          })
        });

        // Update feed.xml
        const feedUrl = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/feed.xml?_t=' + Date.now();
        const feedRes = await fetch(feedUrl, {
          cache: 'no-store',
          headers: {
            'Authorization': 'Bearer ' + ghToken,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        let feedSha = null;
        let existingXml = '';
        if (feedRes.ok) {
          const feedJson = await feedRes.json();
          feedSha = feedJson.sha;
          if (feedJson.content) {
            existingXml = decodeURIComponent(escape(atob(feedJson.content.replace(/\s/g, ''))));
          }
        } else if (feedRes.status !== 404) {
          throw new Error('Failed to fetch existing feed.xml (' + feedRes.status + ')');
        }

        const episodeUrl = 'https://' + owner.toLowerCase() + '.github.io/' + repo + '/' + audioPath;
        const newEpisodeGuid = 'mindspur-daily-' + todayStr + '-' + ts;

        // Parse existing episodes to preserve them and add the new episode on top
        let existingEpisodes = [];
        if (existingXml) {
          const itemRegex = /<item>([\s\S]*?)<\/item>/g;
          let m;
          while ((m = itemRegex.exec(existingXml)) !== null) {
            const block = m[1];
            const getTag = (t) => {
              const tm = new RegExp('<' + t + '[^>]*>([\\s\\S]*?)<\\/' + t + '>', 'i').exec(block);
              return tm ? tm[1].trim() : '';
            };
            const enc = /<enclosure\s+url="([^"]+)"(?:\s+length="([^"]+)")?/i.exec(block);
            if (enc) {
              existingEpisodes.push({
                title: getTag('title').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'),
                description: getTag('description').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>'),
                pubDate: getTag('pubDate'),
                guid: getTag('guid'),
                url: enc[1],
                lengthBytes: parseInt(enc[2] || '1024000', 10),
                duration: getTag('itunes:duration') || '05:00'
              });
            }
          }
        }

        // Add new episode on top of existing episodes without dropping previous episodes
        const dedupedExisting = existingEpisodes.filter(e => e.guid !== newEpisodeGuid && e.url !== episodeUrl);

        const newEpisodeObj = {
          title: 'Daily Reviews - ' + todayStr + ' (' + dueItems.length + ' ' + (dueItems.length === 1 ? 'item' : 'items') + ')',
          pubDate: new Date().toUTCString(),
          url: episodeUrl,
          lengthBytes: Math.round((audioBase64.length * 3) / 4),
          guid: newEpisodeGuid,
          description: 'Daily spaced reviews for ' + todayStr + '. Concepts covered: ' + dueItems.map(i => i.sectionTitle || 'Topic').join(', '),
          duration: '05:00'
        };

        const allEpList = [newEpisodeObj, ...dedupedExisting];

        // Format clean iTunes RSS 2.0 with updated lastBuildDate and namespaces
        const escXml = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const nowUtc = new Date().toUTCString();
        const itemsXmlStr = allEpList.map(ep => 
          '    <item>\n' +
          '      <title>' + escXml(ep.title) + '</title>\n' +
          '      <description>' + escXml(ep.description || ep.title) + '</description>\n' +
          '      <pubDate>' + (ep.pubDate || nowUtc) + '</pubDate>\n' +
          '      <enclosure url="' + escXml(ep.url) + '" length="' + (ep.lengthBytes || 1024000) + '" type="audio/mpeg"/>\n' +
          '      <guid isPermaLink="false">' + escXml(ep.guid) + '</guid>\n' +
          '      <itunes:duration>' + escXml(ep.duration || '05:00') + '</itunes:duration>\n' +
          '    </item>'
        ).join('\n');

        const pagesUrl = 'https://' + owner.toLowerCase() + '.github.io/' + repo;

    // Spaced Repetition Progression
    function advanceItem(item, rating = 'good') {
      const preset = INTERVALS[item.presetKey] || INTERVALS.standard;
      item.intervals = preset;
      item.totalStages = preset.length;
      item.lastReviewedDate = new Date().toISOString();
      item.updatedAt = new Date().toISOString();

      const isSelfGrading = authConfig.reviewMode === 'self_grading';

      if (!isSelfGrading) {
        const nextStage = (item.currentStage || 0) + 1;
        if (nextStage >= preset.length) {
          item.isMastered = true;
          item.nextReviewDate = null;
        } else {
          item.currentStage = nextStage;
          const days = preset[nextStage];
          const nextDate = new Date();
          nextDate.setDate(nextDate.getDate() + days);
          item.nextReviewDate = nextDate.toISOString();
        }
      } else {
        let ease = item.easeFactor || 2.5;
        let stage = item.currentStage || 0;

        if (rating === 'hard') {
          ease = Math.max(1.3, ease - 0.2);
          stage = 0;
          const d = new Date();
          d.setDate(d.getDate() + 1);
          item.nextReviewDate = d.toISOString();
        } else if (rating === 'easy') {
          ease += 0.15;
          const nextStage = stage + 1;
          if (nextStage >= preset.length) {
            item.isMastered = true;
            item.nextReviewDate = null;
          } else {
            stage = nextStage;
            const days = Math.round(preset[nextStage] * 1.3);
            const d = new Date();
            d.setDate(d.getDate() + days);
            item.nextReviewDate = d.toISOString();
          }
        } else {
          // good
          const nextStage = stage + 1;
          if (nextStage >= preset.length) {
            item.isMastered = true;
            item.nextReviewDate = null;
          } else {
            stage = nextStage;
            const days = preset[nextStage];
            const d = new Date();
            d.setDate(d.getDate() + days);
            item.nextReviewDate = d.toISOString();
          }
        }
        item.currentStage = stage;
        item.easeFactor = ease;
      }

      saveLocalItems();
      // Background push to GitHub
      if (authConfig.githubToken) {
        setTimeout(performSync, 500);
      }
    }

    function getItemStatus(item) {
      if (item.isMastered || !item.nextReviewDate) return 'mastered';
      const now = new Date();
      const next = new Date(item.nextReviewDate);
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const nextStart = new Date(next.getFullYear(), next.getMonth(), next.getDate()).getTime();
      if (nextStart < todayStart) return 'overdue';
      if (nextStart === todayStart) return 'due';
      return 'upcoming';
    }

    function getRelativeDateLabel(dateStr) {
      if (!dateStr) return 'Completed';
      const now = new Date();
      const target = new Date(dateStr);
      const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
      const targetStart = new Date(target.getFullYear(), target.getMonth(), target.getDate()).getTime();
      const diffDays = Math.round((targetStart - todayStart) / (1000 * 60 * 60 * 24));
      if (diffDays < 0) return Math.abs(diffDays) + 'd overdue';
      if (diffDays === 0) return 'Today';
      if (diffDays === 1) return 'Tomorrow';
      if (diffDays <= 7) return 'in ' + diffDays + ' days';
      return target.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }

    // Rendering
    function render() {
      const container = document.getElementById('cards-container');
      const emptyState = document.getElementById('empty-state');

      // Calculate Metrics
      let dueCount = 0;
      let upcomingCount = 0;
      let masteredCount = 0;

      items.forEach(it => {
        const s = getItemStatus(it);
        if (s === 'due' || s === 'overdue') dueCount++;
        else if (s === 'mastered') masteredCount++;
        else upcomingCount++;
      });

      // Update Tab Badges (unified primary filter counters)
      const tabDueBadge = document.getElementById('tab-due-badge');
      if (tabDueBadge) tabDueBadge.textContent = dueCount;
      const tabUpcomingBadge = document.getElementById('tab-upcoming-badge');
      if (tabUpcomingBadge) tabUpcomingBadge.textContent = upcomingCount;
      const tabMasteredBadge = document.getElementById('tab-mastered-badge');
      if (tabMasteredBadge) tabMasteredBadge.textContent = masteredCount;
      const tabAllBadge = document.getElementById('tab-all-badge');
      if (tabAllBadge) tabAllBadge.textContent = items.length;

      // Gracefully update legacy metric pills if present
      const mDue = document.getElementById('metric-due-val');
      if (mDue) mDue.textContent = dueCount;
      const mUpcoming = document.getElementById('metric-upcoming-val');
      if (mUpcoming) mUpcoming.textContent = upcomingCount;
      const mMastered = document.getElementById('metric-mastered-val');
      if (mMastered) mMastered.textContent = masteredCount;
      const mTotal = document.getElementById('metric-total-val');
      if (mTotal) mTotal.textContent = items.length;
      const audioPill = document.getElementById('audio-due-pill');
      if (audioPill) audioPill.textContent = dueCount + ' due today';

      // Filter
      const filtered = items.filter(it => {
        if (searchQuery) {
          const q = searchQuery;
          const matchTitle = (it.sectionTitle || '').toLowerCase().includes(q);
          const matchDoc = (it.docTitle || '').toLowerCase().includes(q);
          const matchNotes = (it.notes || '').toLowerCase().includes(q);
          if (!matchTitle && !matchDoc && !matchNotes) return false;
        }

        const s = getItemStatus(it);
        if (currentTab === 'due') return s === 'due' || s === 'overdue';
        if (currentTab === 'upcoming') return s === 'upcoming';
        if (currentTab === 'mastered') return s === 'mastered';
        return true;
      });

      // Sort
      if (currentTab === 'due' || currentTab === 'upcoming') {
        filtered.sort((a, b) => new Date(a.nextReviewDate || 0) - new Date(b.nextReviewDate || 0));
      }

      container.innerHTML = '';
      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      filtered.forEach(it => {
        const card = createCard(it);
        container.appendChild(card);
      });
    }
