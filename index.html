    function setupMobileLightbox() {
      const overlay = document.getElementById('mobile-lightbox');
      const imgEl = document.getElementById('mobile-lightbox-img');
      const captionEl = document.getElementById('mobile-lightbox-caption');
      const btnClose = document.getElementById('btn-close-mobile-lightbox');
      if (!overlay || !imgEl) return;

      function openLb(src, alt) {
        imgEl.src = src;
        imgEl.alt = alt || '';
        if (captionEl) {
          captionEl.textContent = alt || '';
          captionEl.style.display = alt ? 'block' : 'none';
        }
        overlay.style.display = 'flex';
      }

      function closeLb() {
        overlay.style.display = 'none';
        imgEl.src = '';
      }

      if (btnClose) btnClose.addEventListener('click', closeLb);
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay || e.target === btnClose) closeLb();
      });

      document.addEventListener('click', (e) => {
        const target = e.target;
        if (target && target.classList && target.classList.contains('md-image')) {
          e.stopPropagation();
          openLb(target.src, target.alt);
        }
      });
    }

    function setupMobileImageUpload(textarea, attachBtn, fileInput) {
      if (!textarea) return;

      function insertMarkdownImage(url, alt) {
        const altText = String(alt || 'Image').replace(/[^a-zA-Z0-9 _-]/g, ' ').trim() || 'Image';
        const md = '\n\n![' + altText + '](' + url + ')\n\n';
        const start = textarea.selectionStart !== undefined ? textarea.selectionStart : textarea.value.length;
        const end = textarea.selectionEnd !== undefined ? textarea.selectionEnd : start;
        const val = textarea.value;
        textarea.value = val.substring(0, start) + md + val.substring(end);
        const newPos = start + md.length;
        textarea.selectionStart = textarea.selectionEnd = newPos;
        textarea.focus();
      }

      function compressImageBlob(file, maxDimension, quality) {
        maxDimension = maxDimension || 1600;
        quality = quality !== undefined ? quality : 0.82;
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onerror = () => reject(new Error('Failed to read image file'));
          reader.onload = (e) => {
            const img = new Image();
            img.onerror = () => reject(new Error('Failed to load image'));
            img.onload = () => {
              let width = img.naturalWidth || img.width;
              let height = img.naturalHeight || img.height;
              if (width > maxDimension || height > maxDimension) {
                if (width >= height) {
                  height = Math.round(height * (maxDimension / width));
                  width = maxDimension;
                } else {
                  width = Math.round(width * (maxDimension / height));
                  height = maxDimension;
                }
              }
              const canvas = document.createElement('canvas');
              canvas.width = Math.max(1, width);
              canvas.height = Math.max(1, height);
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);

              // Try webp first
              let dataUrl = canvas.toDataURL('image/webp', quality);
              let format = 'webp';
              if (!dataUrl || !dataUrl.startsWith('data:image/webp')) {
                dataUrl = canvas.toDataURL('image/jpeg', quality);
                format = 'jpeg';
              }
              resolve({ dataUrl: dataUrl, format: format, width: width, height: height });
            };
            img.src = e.target.result;
          };
          reader.readAsDataURL(file);
        });
      }

      async function uploadToGitHub(base64Content, extension) {
        if (!authConfig || !authConfig.githubToken || !authConfig.githubOwner) return null;
        const repo = authConfig.githubRepo || 'mindspur-podcast';
        const timestamp = Date.now();
        const rand = Math.random().toString(36).substring(2, 8);
        const filename = 'img_' + timestamp + '_' + rand + '.' + (extension || 'webp');
        const assetPath = 'assets/images/' + filename;
        const apiUrl = 'https://api.github.com/repos/' + authConfig.githubOwner + '/' + repo + '/contents/' + assetPath;

        const res = await fetch(apiUrl, {
          method: 'PUT',
          headers: {
            'Authorization': 'Bearer ' + authConfig.githubToken,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify({
            message: 'Upload note image: ' + filename,
            content: base64Content,
            branch: 'main'
          })
        });

        if (!res.ok) {
          throw new Error('GitHub upload failed with HTTP ' + res.status);
        }

        return 'https://' + authConfig.githubOwner.toLowerCase() + '.github.io/' + repo + '/' + assetPath;
      }

      async function processAndInsertImage(file, label) {
        if (!file || !file.type || !file.type.startsWith('image/')) {
          showToast('⚠️ Selected file is not an image');
          return;
        }
        try {
          showToast('⏳ Compressing image to WebP...');
          const compressed = await compressImageBlob(file, 1600, 0.82);
          const rawBase64 = compressed.dataUrl.split(',')[1];
          let finalUrl = null;

          if (authConfig && authConfig.githubToken && authConfig.githubOwner) {
            try {
              finalUrl = await uploadToGitHub(rawBase64, compressed.format);
            } catch (uploadErr) {
              console.warn('Mobile GitHub upload failed, falling back to local data URL:', uploadErr);
              finalUrl = compressed.dataUrl;
            }
          } else {
            finalUrl = compressed.dataUrl;
          }

          insertMarkdownImage(finalUrl, label || 'Image');
          showToast(finalUrl.startsWith('http') ? '📷 Photo uploaded to GitHub CDN!' : '📷 Photo compressed and attached!');
        } catch (err) {
          console.error('Image processing failed:', err);
          showToast('❌ Image processing failed: ' + (err.message || 'Unknown error'));
        }
      }

      if (attachBtn && fileInput) {
        attachBtn.addEventListener('click', (e) => {
          e.preventDefault();
          fileInput.click();
        });

        fileInput.addEventListener('change', () => {
          if (fileInput.files && fileInput.files[0]) {
            processAndInsertImage(fileInput.files[0], 'Photo');
            fileInput.value = '';
          }
        });
      }

      // Clipboard Paste
      textarea.addEventListener('paste', (e) => {
        if (!e.clipboardData || !e.clipboardData.items) return;
        const items = e.clipboardData.items;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type && items[i].type.startsWith('image/')) {
            e.preventDefault();
            const file = items[i].getAsFile();
            if (file) {
              processAndInsertImage(file, 'Pasted Image');
            }
            break;
          }
        }
      });

      // Drag and Drop
      textarea.addEventListener('dragover', (e) => {
        e.preventDefault();
        textarea.classList.add('dragover');
      });
      textarea.addEventListener('dragleave', () => {
        textarea.classList.remove('dragover');
      });
      textarea.addEventListener('drop', (e) => {
        e.preventDefault();
        textarea.classList.remove('dragover');
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
          const file = e.dataTransfer.files[0];
          if (file.type && file.type.startsWith('image/')) {
            processAndInsertImage(file, 'Dropped Image');
          }
        }
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[m]);
    }

    function isSafeUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const t = url.trim();
      if (/[\r\n\t\0"'<>]/.test(t)) return false;
      if (t.includes('&quot;') || t.includes('&#39;')) return false;
      const lower = t.toLowerCase();
      return lower.startsWith('https://') || lower.startsWith('http://') || lower.startsWith('mailto:') || lower.startsWith('#');
    }

    function isSafeImageUrl(url) {
      if (!url || typeof url !== 'string') return false;
      const t = url.trim();
      if (/[\r\n\t\0"'<>]/.test(t)) return false;
      if (t.includes('&quot;') || t.includes('&#39;')) return false;
      const lower = t.toLowerCase();
      if (lower.startsWith('javascript:') || lower.startsWith('vbscript:') || lower.startsWith('data:text/') || lower.startsWith('file:')) return false;
      if (lower.startsWith('https://') || lower.startsWith('http://')) return true;
      if (lower.startsWith('assets/') || lower.startsWith('./assets/') || lower.startsWith('/assets/') || /^(\.\/|\/)?[\w\-./]+\.(?:png|jpe?g|webp|gif|bmp|ico)$/i.test(t)) return true;
      if (lower.startsWith('data:image/')) {
        if (lower.startsWith('data:image/svg')) return false;
        return /^data:image\/(?:png|jpe?g|webp|gif|bmp);base64,[A-Za-z0-9+/=]+$/.test(t);
      }
      return false;
    }

    function renderMarkdown(text) {
      if (!text || typeof text !== 'string') return '';
      let md = escapeHtml(text);
      const codeBlocks = [];
      md = md.replace(/```([\w\-]*)[\r\n]+([\s\S]*?)```/g, (match, lang, code) => {
        const idx = codeBlocks.length;
        const langClass = lang ? ' class="language-' + lang + '"' : '';
        codeBlocks.push('<pre class="md-code-block"><code' + langClass + '>' + code.trim() + '</code></pre>');
        return 'XMDCODEBLOCK' + idx + 'X';
      });
      const inlineCodes = [];
      md = md.replace(/`([^\x60\r\n]+)`/g, (match, code) => {
        const idx = inlineCodes.length;
        inlineCodes.push('<code class="md-inline-code">' + code + '</code>');
        return 'XMDINLINECODE' + idx + 'X';
      });
      md = md.replace(/^(?:---|\*\*\*|___)[ \t]*$/gm, '<hr class="md-hr">');
      md = md.replace(/(?:^&gt;[ \t]?(.*?)(?:[\r\n]|$))+/gm, (match) => {
        const inner = match.trim().split(/[\r\n]+/).map(l => l.replace(/^&gt;[ \t]?/, '').trim()).join('<br>');
        return '<blockquote class="md-quote">' + inner + '</blockquote>\n';
      });
      md = md.replace(/^#### (.*?)$/gm, '<h6 class="md-h4">$1</h6>');
      md = md.replace(/^### (.*?)$/gm, '<h5 class="md-h3">$1</h5>');
      md = md.replace(/^## (.*?)$/gm, '<h4 class="md-h2">$1</h4>');
      md = md.replace(/^# (.*?)$/gm, '<h3 class="md-h1">$1</h3>');
      md = md.replace(/^-[ \t]*\[x\][ \t]*(.*?)$/gim, '<div class="md-task-item"><span class="md-task-check checked">☑</span> $1</div>');
      md = md.replace(/^-[ \t]*\[[ \t]*\][ \t]*(.*?)$/gim, '<div class="md-task-item"><span class="md-task-check">☐</span> $1</div>');

      const lines = md.split(/\r?\n/);
      const processedLines = [];
      let inUl = false, inOl = false;
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const ulMatch = line.match(/^([ \t]*)[-*+][ \t]+(.+)$/);
        const olMatch = line.match(/^([ \t]*)\d+\.[ \t]+(.+)$/);
        if (ulMatch && !line.includes('class="md-task-item"')) {
          if (inOl) { processedLines.push('</ol>'); inOl = false; }
          if (!inUl) { processedLines.push('<ul class="md-ul">'); inUl = true; }
          processedLines.push('  <li class="md-li">' + ulMatch[2] + '</li>');
        } else if (olMatch) {
          if (inUl) { processedLines.push('</ul>'); inUl = false; }
          if (!inOl) { processedLines.push('<ol class="md-ol">'); inOl = true; }
          processedLines.push('  <li class="md-li">' + olMatch[2] + '</li>');
        } else {
          if (inUl) { processedLines.push('</ul>'); inUl = false; }
          if (inOl) { processedLines.push('</ol>'); inOl = false; }
          processedLines.push(line);
        }
      }
      if (inUl) processedLines.push('</ul>');
      if (inOl) processedLines.push('</ol>');
      md = processedLines.join('\n');

      // Images before links
      md = md.replace(/!\[([^\]]*)\]\(((?:[^)(]+|\((?:[^)(]+|\([^)(]*\))*\))*)\)/g, (match, alt, inner) => {
        const trimmedInner = (inner || '').trim();
        const titleMatch = trimmedInner.match(/^([^\s]+)(?:\s+(?:&quot;([\s\S]*?)&quot;|&#39;([\s\S]*?)&#39;|"([\s\S]*?)"|'([\s\S]*?)'))?$/);
        let src = '';
        let title = '';
        if (titleMatch) {
          src = titleMatch[1];
          title = titleMatch[2] || titleMatch[3] || titleMatch[4] || titleMatch[5] || '';
        } else {
          const spaceIdx = trimmedInner.indexOf(' ');
          src = spaceIdx === -1 ? trimmedInner : trimmedInner.slice(0, spaceIdx);
        }
        const safeAlt = (alt || '').replace(/"/g, '&quot;');
        if (!isSafeImageUrl(src)) return safeAlt || '';
        const titleAttr = title ? ' title="' + title.replace(/"/g, '&quot;') + '"' : '';
        return '<img src="' + src + '" alt="' + safeAlt + '" class="md-image" loading="lazy" decoding="async"' + titleAttr + '>';
      });

      // Links (avoid broken image tags)
      md = md.replace(/(?<!\!)\[([^\]]+)\]\(([^)]+)\)/g, (match, linkText, href) => {
        const cleanHref = href.trim();
        return isSafeUrl(cleanHref) ? '<a href="' + cleanHref + '" class="md-link" target="_blank" rel="noopener noreferrer">' + linkText + '</a>' : match;
      });

      md = md.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>');
      md = md.replace(/___([^_]+)___/g, '<strong><em>$1</em></strong>');
      md = md.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      md = md.replace(/__([^_]+)__/g, '<strong>$1</strong>');
      md = md.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      md = md.replace(/_([^_]+)_/g, '<em>$1</em>');
      md = md.replace(/~~([^~]+)~~/g, '<del>$1</del>');

      const blockTags = ['<h1', '<h2', '<h3', '<h4', '<h5', '<h6', '<pre', '<blockquote', '<ul', '<ol', '</ul', '</ol', '<li', '<div', '<hr'];
      md = md.split('\n').map(l => {
        const t = l.trim();
        if (!t) return '';
        const isBlock = blockTags.some(tag => t.startsWith(tag));
        return isBlock ? l : l + '<br>';
      }).join('\n').replace(/(?:<br>)+$/g, '');

      md = md.replace(/XMDCODEBLOCK(\d+)X/g, (match, idx) => codeBlocks[parseInt(idx, 10)] || '');
      md = md.replace(/XMDINLINECODE(\d+)X/g, (match, idx) => inlineCodes[parseInt(idx, 10)] || '');
      return md.trim();
    }
  </script>
</body>
</html>
